<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="只有灰度指标达标的版本才会全量发布"
     font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8f959e"/>
    </marker>
  </defs>

  <!-- 标题：一句结论 -->
  <text x="32" y="48" font-size="18" font-weight="600" fill="#1f2329">只有灰度指标达标的版本才会全量发布</text>

  <!-- 连线（先画，压在节点下面） -->
  <g fill="none" stroke="#8f959e" stroke-width="1.5">
    <path d="M200 152H264" marker-end="url(#arrow)"/>
    <path d="M440 152H520" marker-end="url(#arrow)"/>
    <path d="M664 152H736" marker-end="url(#arrow)"/>
    <path d="M592 200V304H440" marker-end="url(#arrow)"/>
    <path d="M264 304H200" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#646a73">
    <text x="472" y="140" text-anchor="middle">满 24 小时</text>
    <text x="700" y="140" text-anchor="middle">是</text>
    <text x="604" y="256">否</text>
    <text x="232" y="292" text-anchor="middle">回滚？</text>
  </g>

  <!-- 节点 -->
  <g>
    <rect x="32" y="120" width="168" height="64" rx="8" fill="#ffffff" stroke="#8f959e" stroke-width="1.5"/>
    <text x="116" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2329">合入主干</text>
    <text x="116" y="168" text-anchor="middle" font-size="13" fill="#1f2329">自动构建和测试</text>
  </g>
  <g>
    <rect x="264" y="120" width="176" height="64" rx="8" fill="#ffffff" stroke="#8f959e" stroke-width="1.5"/>
    <text x="352" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2329">灰度发布</text>
    <text x="352" y="168" text-anchor="middle" font-size="13" fill="#1f2329">5% 的租户</text>
  </g>
  <g>
    <polygon points="520,152 592,104 664,152 592,200" fill="#ffffff" stroke="#8f959e" stroke-width="1.5"/>
    <text x="592" y="148" text-anchor="middle" font-size="13" fill="#1f2329">错误率</text>
    <text x="592" y="166" text-anchor="middle" font-size="13" fill="#1f2329">≤ 0.1%？</text>
  </g>
  <g>
    <rect x="736" y="120" width="192" height="64" rx="8" fill="#3370ff" fill-opacity="0.08" stroke="#3370ff" stroke-width="2"/>
    <text x="832" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2329">全量发布</text>
    <text x="832" y="168" text-anchor="middle" font-size="13" fill="#1f2329">需值班负责人确认</text>
  </g>
  <g>
    <rect x="264" y="272" width="176" height="64" rx="8" fill="#ffffff" stroke="#f54a45" stroke-width="1.5"/>
    <text x="352" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2329">停止灰度</text>
    <text x="352" y="320" text-anchor="middle" font-size="13" fill="#1f2329">通知提交人</text>
  </g>
  <g>
    <rect x="32" y="272" width="168" height="64" rx="8" fill="#ffffff" stroke="#8f959e" stroke-width="1.5"/>
    <text x="116" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2329">回到修复</text>
    <text x="116" y="320" text-anchor="middle" font-size="13" fill="#1f2329">由提交人处理</text>
  </g>

  <!-- 图例 -->
  <g font-size="12" fill="#646a73">
    <line x1="32" y1="392" x2="72" y2="392" stroke="#8f959e" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="80" y="396">虚线和「？」：原文未说明是否自动执行</text>
    <rect x="360" y="384" width="16" height="16" rx="4" fill="#f54a45" fill-opacity="0.08" stroke="#f54a45"/>
    <text x="384" y="396">红框：异常路径</text>
  </g>
</svg>
