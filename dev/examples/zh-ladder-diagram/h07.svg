<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 880" role="img" aria-label="方向已通过；开发前要先过压测，上线前要补上实时权限校验和客户资源评估"
     font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8f959e"/>
    </marker>
  </defs>

  <text x="32" y="48" font-size="18" font-weight="600" fill="#1f2329">方向已通过；开发前要先过压测，上线前要补上实时权限校验和客户资源评估</text>
  <text x="32" y="74" font-size="12" fill="#646a73">据 10 月 9 日评审记录整理。左：方案的检索链路；右：评审意见，编号对应左边的部件</text>

  <text x="32" y="112" font-size="14" font-weight="600" fill="#1f2329">检索链路（方案）</text>
  <text x="560" y="112" font-size="14" font-weight="600" fill="#1f2329">评审意见</text>

  <!-- 链路连线 -->
  <g fill="none" stroke="#8f959e" stroke-width="1.5">
    <path d="M176 176V200H112V224" marker-end="url(#arrow)"/>
    <path d="M176 200H296V224" marker-end="url(#arrow)"/>
    <path d="M388 184V224" marker-end="url(#arrow)"/>
    <path d="M112 280V320" marker-end="url(#arrow)"/>
    <path d="M280 280V320" marker-end="url(#arrow)"/>
    <path d="M176 376V416" marker-end="url(#arrow)"/>
    <path d="M176 472V552" marker-end="url(#arrow)"/>
    <path d="M176 512H336" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#646a73">
    <text x="396" y="208">召回来源</text>
    <text x="120" y="304">取前 50</text>
    <text x="288" y="304">取前 50</text>
    <text x="184" y="400">合并结果</text>
    <text x="168" y="532" text-anchor="end">取前 8 条</text>
    <text x="256" y="504" text-anchor="middle">提议加在这里</text>
  </g>

  <!-- 链路节点 -->
  <g>
    <rect x="112" y="128" width="128" height="48" rx="8" fill="#ffffff" stroke="#8f959e" stroke-width="1.5"/>
    <text x="176" y="157" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2329">用户提问</text>
  </g>
  <g>
    <rect x="360" y="128" width="168" height="56" rx="8" fill="#ffffff" stroke="#8f959e" stroke-width="1.5"/>
    <text x="444" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2329">向量索引（新增）</text>
    <text x="444" y="172" text-anchor="middle" font-size="12" fill="#646a73">离线构建，每天凌晨增量</text>
  </g>
  <g>
    <rect x="32" y="224" width="160" height="56" rx="8" fill="#ffffff" stroke="#8f959e" stroke-width="1.5"/>
    <text x="112" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2329">关键词召回</text>
    <text x="112" y="268" text-anchor="middle" font-size="12" fill="#646a73">BM25，现网已有</text>
  </g>
  <g>
    <rect x="232" y="224" width="184" height="56" rx="8" fill="#ffffff" stroke="#8f959e" stroke-width="1.5"/>
    <text x="324" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2329">向量召回（新增）</text>
    <text x="324" y="268" text-anchor="middle" font-size="12" fill="#646a73">768 维，开源中文嵌入模型</text>
  </g>
  <g>
    <rect x="48" y="320" width="256" height="56" rx="8" fill="#ffffff" stroke="#8f959e" stroke-width="1.5"/>
    <text x="176" y="344" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2329">合并去重 + 权限过滤</text>
    <text x="176" y="364" text-anchor="middle" font-size="12" fill="#646a73">方案：权限在召回阶段过滤</text>
  </g>
  <g>
    <rect x="64" y="416" width="224" height="56" rx="8" fill="#ffffff" stroke="#8f959e" stroke-width="1.5"/>
    <text x="176" y="440" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2329">重排序模型（新增）</text>
    <text x="176" y="460" text-anchor="middle" font-size="12" fill="#646a73">对合并结果打分</text>
  </g>
  <g>
    <rect x="336" y="480" width="192" height="64" rx="8" fill="#ffffff" stroke="#f54a45" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="432" y="506" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2329">实时权限校验</text>
    <text x="432" y="526" text-anchor="middle" font-size="12" fill="#646a73">何工提议的兜底，尚未实现</text>
  </g>
  <g>
    <rect x="64" y="552" width="224" height="48" rx="8" fill="#ffffff" stroke="#8f959e" stroke-width="1.5"/>
    <text x="176" y="581" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2329">大模型生成答案</text>
  </g>

  <!-- 编号徽标（链路上） -->
  <g font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">
    <circle cx="432" cy="240" r="10" fill="#646a73"/><text x="432" y="244">1</text>
    <circle cx="432" cy="264" r="10" fill="#646a73"/><text x="432" y="268">4</text>
    <circle cx="304" cy="444" r="10" fill="#646a73"/><text x="304" y="448">1</text>
    <circle cx="320" cy="348" r="10" fill="#646a73"/><text x="320" y="352">2</text>
    <circle cx="544" cy="512" r="10" fill="#646a73"/><text x="544" y="516">2</text>
    <circle cx="544" cy="156" r="10" fill="#646a73"/><text x="544" y="160">3</text>
  </g>

  <!-- 实测效果 -->
  <g font-size="13" fill="#1f2329">
    <text x="32" y="648" font-size="14" font-weight="600">作者实测（混合 + 重排 对比现网 BM25）</text>
    <text x="32" y="672">前 8 条命中率 61% → 81%，答案正确率 54% → 70%</text>
    <text x="32" y="692">P95 延迟 1.2 秒 → 2.4 秒</text>
    <text x="32" y="712">数字/金额查询、跨文档汇总两类仍明显较差</text>
    <text x="32" y="736" font-size="12" fill="#646a73">只测过单机 10 万篇；评测集 70% 来自同一家金融客户</text>
    <text x="32" y="756" font-size="12" fill="#646a73">客户生产环境一般 100 万–500 万篇，未测</text>
  </g>

  <!-- 评审意见卡片 -->
  <g>
    <rect x="560" y="128" width="368" height="136" rx="8" fill="#ffffff" stroke="#8f959e" stroke-width="1.5"/>
    <circle cx="588" cy="149" r="10" fill="#646a73"/>
    <text x="588" y="153" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">1</text>
    <text x="606" y="154" font-size="14" font-weight="600" fill="#1f2329">性能 · 架构组吴工</text>
    <g font-size="13" fill="#1f2329">
      <text x="576" y="178">500 万篇规模下 P95 能否 ≤ 3 秒：没有数据</text>
      <text x="576" y="198">作者估算约 2.8 秒，承认未实测</text>
      <text x="576" y="222" fill="#f54a45" font-weight="600">开发前置：500 万篇压测，P95 ≤ 3 秒</text>
      <text x="576" y="242">未达标：提交降级方案（如关闭重排序）再评审</text>
    </g>
  </g>
  <g>
    <rect x="560" y="280" width="368" height="132" rx="8" fill="#ffffff" stroke="#8f959e" stroke-width="1.5"/>
    <circle cx="588" cy="301" r="10" fill="#646a73"/>
    <text x="588" y="305" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">2</text>
    <text x="606" y="306" font-size="14" font-weight="600" fill="#1f2329">权限 · 安全组孙工</text>
    <g font-size="13" fill="#1f2329">
      <text x="576" y="330">索引离线更新，文档权限变更后</text>
      <text x="576" y="350">最长约 24 小时内仍可能被向量召回</text>
      <text x="576" y="370">孙工：对政务、金融客户不可接受</text>
      <text x="576" y="394" fill="#f54a45" font-weight="600">上线前置：实时兜底完成并通过安全测试</text>
    </g>
  </g>
  <g>
    <rect x="560" y="428" width="368" height="176" rx="8" fill="#ffffff" stroke="#8f959e" stroke-width="1.5"/>
    <circle cx="588" cy="449" r="10" fill="#646a73"/>
    <text x="588" y="453" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">3</text>
    <text x="606" y="454" font-size="14" font-weight="600" fill="#1f2329">资源与运维 · 运维组郑工</text>
    <g font-size="13" fill="#1f2329">
      <text x="576" y="478">500 万篇索引约需 64 GB 内存（作者估计）</text>
      <text x="576" y="498">部分客户服务器仅 128 GB，已被占用约 70%</text>
      <text x="576" y="522" fill="#f54a45" font-weight="600">上线前置：逐个客户做资源评估，</text>
      <text x="576" y="542" fill="#f54a45" font-weight="600">资源不足的继续用 BM25</text>
      <text x="576" y="566">全量重建预计约 14 小时：只在周末或客户</text>
      <text x="576" y="586">确认的维护窗口进行，写入部署手册</text>
    </g>
  </g>
  <g>
    <rect x="560" y="620" width="368" height="132" rx="8" fill="#ffffff" stroke="#8f959e" stroke-width="1.5"/>
    <circle cx="588" cy="641" r="10" fill="#646a73"/>
    <text x="588" y="645" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">4</text>
    <text x="606" y="646" font-size="14" font-weight="600" fill="#1f2329">嵌入模型 · 孙工、林经理</text>
    <g font-size="13" fill="#1f2329">
      <text x="576" y="670">许可证允许商用，法务 9 月已审核通过</text>
      <text x="576" y="690">上线前校验模型文件完整性（何工自行跟进）</text>
      <text x="576" y="714">某律所客户不希望用任何开源模型？</text>
      <text x="576" y="734">销售转述，待林经理向客户核实（未决）</text>
    </g>
  </g>

  <!-- 下一步 + 图例 -->
  <text x="32" y="800" font-size="13" fill="#1f2329"><tspan font-weight="600">下一步：</tspan>压测出结果后由何工申请第二次评审；未经第二次评审，不得启动开发</text>
  <text x="32" y="820" font-size="13" fill="#1f2329">压测和权限兜底完成前，不对客户承诺上线时间（林经理同意）</text>
  <g font-size="12" fill="#646a73">
    <text x="32" y="848"><tspan fill="#f54a45" font-weight="600">红字</tspan>：评审结论里的前置条件</text>
    <line x1="232" y1="844" x2="272" y2="844" stroke="#f54a45" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="280" y="848">红色虚线框：只是提议、尚未实现的部件</text>
    <text x="560" y="848">「？」：转述信息，未经核实</text>
  </g>
</svg>
